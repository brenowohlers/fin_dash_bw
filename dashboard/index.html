<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitation News Dashboard</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Navbar -->
    <nav class="navbar">
      <h1 class="navbar-title">🌊 Sanitation News Intelligence</h1>
      <div class="navbar-actions">
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">
          🌙 Theme
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
      <div class="container">
        <!-- Tab Navigation -->
        <div class="tabs">
          <button class="tab-button active" data-tab="today">Today</button>
          <button class="tab-button" data-tab="search">Search & Filter</button>
          <button class="tab-button" data-tab="analytics">Analytics</button>
        </div>

        <!-- Tab: Today -->
        <div id="today-tab" class="tab-content active">
          <div id="today-content">
            <!-- Loading... -->
          </div>
        </div>

        <!-- Tab: Search & Filter -->
        <div id="search-tab" class="tab-content">
          <!-- Filter panel and results will be rendered here -->
        </div>

        <!-- Tab: Analytics -->
        <div id="analytics-tab" class="tab-content">
          <!-- Charts will be rendered here -->
        </div>
      </div>
    </main>
  </div>

  <!-- App Script -->
  <script src="assets/app.js"></script>
</body>
</html>
